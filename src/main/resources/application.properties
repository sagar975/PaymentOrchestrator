# Application
spring.application.name=payment-orchestrator

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orchestrator}?TimeZone=UTC
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server
server.port=8080

# Logging
logging.level.com.payments=DEBUG

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# PayU
payu.merchant.key=${PAYU_MERCHANT_KEY}
payu.merchant.salt=${PAYU_MERCHANT_SALT}
payu.base.url=https://test.payu.in

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}

# Checkout.com
# Checkout.com
checkout.secret.key=${CHECKOUT_SECRET_KEY:sk_test_mock}
checkout.base.url=https://xagkoofz.api.sandbox.checkout.com
checkout.processing.channel.id=pc_x65qfzon4elulo24d73vvbqt4e


# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-orchestrator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.payments.orchestrator.adapter.messaging.TransactionFailedEvent
# SSL verification — false for sandbox, true for production
app.ssl.verify=false

# Webhook secrets
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:webhook_secret}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:webhook_secret}
checkout.webhook.secret=${CHECKOUT_WEBHOOK_SECRET:webhook_secret}

# JWT
jwt.secret=${JWT_SECRET:mySecretKey2026PaymentOrchestrator}
jwt.expiration.ms=86400000