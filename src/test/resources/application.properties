# Test overrides: use in-memory H2 instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:orchestrator;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Razorpay — dummy values for tests
razorpay.key.id=rzp_test_dummy
razorpay.key.secret=dummy_secret
# PayU dummy values for tests
payu.merchant.key=test_key
payu.merchant.salt=test_salt
payu.base.url=https://test.payu.in
# Stripe dummy for tests
stripe.secret.key=sk_test_dummy
# Checkout.com dummy for tests
checkout.secret.key=sk_test_dummy
checkout.base.url=https://api.sandbox.checkout.com
checkout.processing.channel.id=pc_test_dummy
app.ssl.verify=false
# Webhook secrets dummy
razorpay.webhook.secret=test_webhook_secret
stripe.webhook.secret=test_webhook_secret
checkout.webhook.secret=test_webhook_secret
jwt.secret=test_secret_key_for_junit_tests
jwt.expiration.ms=86400000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=test_password
otp.expiry.minutes=5
otp.max.attempts=3